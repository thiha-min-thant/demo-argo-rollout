# §15 — header-based smoke routing. Replaces the Rollout from demo-app.yaml:
#   kubectl --context kind-rollouts-lab apply -f manifests/advanced/rollout-header-routing.yaml
# The plugin injects a named rule (`canary-smoke`) into HTTPRoute `demo` while the
# rollout is in progress and removes it on completion (needs Gateway API >= 1.2).
# Smoke-test the canary deterministically:  curl -H 'X-Canary: true' http://localhost:8081/api/version
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo
  namespace: demo
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: demo }
  strategy:
    canary:
      canaryService: demo-canary
      stableService: demo-stable
      dynamicStableScale: true
      abortScaleDownDelaySeconds: 30
      trafficRouting:
        managedRoutes:
          - name: canary-smoke
        plugins:
          argoproj-labs/gatewayAPI:
            namespace: demo
            httpRoutes:
              - name: demo
                useHeaderRoutes: true
      analysis:
        templates:
          - templateName: canary-slo
        startingStep: 3                   # start measuring once real traffic (10 %) flows
        args:
          - name: canary-service
            value: demo-canary
          - name: namespace
            value: demo
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      steps:
        - setWeight: 0                    # 0 % random traffic …
        - setHeaderRoute:                 # … but header-tagged requests go to the canary
            name: canary-smoke
            match:
              - headerName: X-Canary
                headerValue:
                  exact: "true"
        - pause: { duration: 2m }         # run smoke tests here (CI job / Argo Workflows / synthetic checks)
        - setWeight: 10
        - pause: { duration: 90s }
        - setWeight: 30
        - pause: { duration: 90s }
        - setWeight: 60
        - pause: {}
        - setHeaderRoute:                 # remove the smoke rule before full promotion
            name: canary-smoke
  template:
    metadata:
      labels: { app: demo }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: canarybird
          image: ghcr.io/thiha-min-thant/canarybird:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - { name: VERSION, value: v1 }
            - { name: COLOR,   value: blue }
            - { name: POD_NAME,  valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: CONTROL_PEERS, value: demo-headless }
            - { name: LOADGEN_ENABLED, value: "false" }
            - { name: LOG_FORMAT, value: json }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
